name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Runs on both the pinned image and whatever is currently newest. An
    # uncommitted lockfile once let swift-sdk float from 0.10.x to 0.12.x and
    # broke CI; the symmetric risk is a toolchain divergence between the dev
    # machine and a single pinned runner. Testing both ends catches it.
    #
    # macos-latest is deliberate rather than a hard-pinned newest label: the
    # label set changes over time, and `latest` cannot go stale or 404.
    #
    # Both ends run on main, where a toolchain divergence has to be caught.
    # Pull requests run the pinned image alone: macOS bills at 10x, so the
    # second runner costs ~10 billable minutes per PR revision to re-answer a
    # question the merge to main asks again minutes later. (Measured 2026-08-26:
    # macos-15 carries Swift 6.1.2 and macos-latest Swift 6.3.3 — the images do
    # diverge, which is why this matrix keeps both rather than collapsing.)
    #
    # macos-15 is the FLOOR runner: it selects Xcode 26.0.1 (Swift 6.2.0), the
    # oldest toolchain the README promises. Its default Xcode 16.4 (Swift 6.1)
    # cannot resolve swift-collections 1.7+, which requires tools version 6.2.
    # Raise `xcode` here whenever the stated minimum moves.
    name: Build & Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'pull_request' && fromJSON('["macos-15"]') || fromJSON('["macos-15", "macos-latest"]') }}
        include:
          - runner: macos-15
            xcode: "26.0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Report toolchain
        run: swift --version

      # Keyed on Package.resolved so the cache invalidates exactly when the
      # dependency graph changes, and on the selected Xcode so two toolchains
      # never share incompatible build artifacts.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ matrix.runner }}-xcode${{ matrix.xcode || 'default' }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('**/.swift-version') }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-${{ matrix.runner }}-xcode${{ matrix.xcode || 'default' }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ matrix.runner }}-xcode${{ matrix.xcode || 'default' }}-

      # The warning gate reuses THIS build's output. It used to run a third full
      # `swift build` purely to grep its log, which on a cold cache doubled the
      # job's compile time to check something the first build already knew.
      - name: Build (Debug) + warning gate
        run: |
          set -o pipefail
          swift build 2>&1 | tee build-output.txt
          if grep -q "warning:" build-output.txt; then
            echo "::error::Build produced warnings"
            grep "warning:" build-output.txt
            exit 1
          fi

      - name: Build (Release)
        run: swift build -c release

      # System tests (APPLE_BRIDGE_SYSTEM_TESTS=1) are intentionally NOT run
      # here: they require real TCC grants for Calendar/Reminders and a signed-in
      # user session, neither of which exists on a hosted runner. Their suites
      # self-skip when the grant is absent, so this is a clean skip, not a hole.
      - name: Run Tests
        run: swift test

      # Builds Tests/LibraryConsumer, a stand-in outside package that depends on
      # the library products. Proves they resolve as a dependency, coexist with
      # a consumer's own `Core` / `Adapters` targets, and that Contacts +
      # EventKit do not link sqlite3 — the reason Adapters was split by surface.
      - name: Library products (consumer build)
        run: |
          set -euo pipefail
          swift build --package-path Tests/LibraryConsumer
          BIN="$(swift build --package-path Tests/LibraryConsumer --show-bin-path)/library-consumer"
          LINKS=$(otool -L "$BIN")
          echo "$LINKS"
          if grep -qi sqlite <<<"$LINKS"; then
            echo "::error::A Contacts + EventKit consumer links sqlite3; a library target gained a SQLite dependency."
            exit 1
          fi
          "$BIN"

      # Folded in from a standalone `lint` job. The check itself takes ~18
      # seconds, but as its own macOS job it was billed the 1-minute minimum
      # against the 10x multiplier — ten minutes per trigger to parse a
      # manifest. As a step it costs nothing and now runs on every runner in
      # the matrix rather than one.
      - name: Verify Package
        run: swift package dump-package > /dev/null
